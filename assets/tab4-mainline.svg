<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="262" viewBox="0 0 1000 262" role="img" aria-labelledby="title desc">
  <title id="title">Galaxy Tab 4 mainline Linux</title>
  <desc id="desc">Illustration of a Galaxy Tab 4 tablet with a terminal screen beside the project title and system signals.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset=".58" stop-color="#102b3f"/><stop offset="1" stop-color="#0d1d28"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061c23"/><stop offset="1" stop-color="#0c3f3b"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1"><stop stop-color="#3b5061"/><stop offset=".5" stop-color="#94a3b8"/><stop offset="1" stop-color="#3b5061"/></linearGradient>
  </defs>
  <rect width="1000" height="262" rx="24" fill="url(#background)"/>
  <g opacity=".13" stroke="#7dd3fc"><path d="M0 52h1000M0 104h1000M0 156h1000M0 208h1000M100 0v262M200 0v262M300 0v262M400 0v262M500 0v262M600 0v262M700 0v262M800 0v262M900 0v262"/></g>
  <g transform="translate(57 26) rotate(-3 142 105)">
    <rect x="0" y="0" width="294" height="210" rx="19" fill="url(#edge)"/>
    <rect x="5" y="5" width="284" height="200" rx="15" fill="#101827"/>
    <rect x="22" y="15" width="249" height="180" rx="5" fill="url(#screen)" stroke="#237b78"/>
    <circle cx="9" cy="106" r="2" fill="#8796a4"/>
    <circle cx="282" cy="106" r="6" fill="none" stroke="#718096" stroke-width="1.5"/>
    <g font-family="monospace">
      <text x="37" y="44" font-size="14" fill="#7dd3fc">$ uname -m</text>
      <text x="37" y="63" font-size="14" fill="#a7f3d0">armv7l</text>
      <text x="37" y="92" font-size="14" fill="#7dd3fc">$ cat /etc/os-release</text>
      <text x="37" y="111" font-size="13" fill="#cbd5e1">Debian / trixie</text>
      <text x="37" y="143" font-size="12" fill="#99f6e4">[ CPU ] [ GPU ] [ KMS ]</text>
      <path d="M37 163h22l8-15 13 25 12-10h19l8-7 12 7h34l8-13 10 13h37" stroke="#2dd4bf" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
    </g>
  </g>
  <g font-family="DejaVu Sans,Arial,sans-serif">
    <text x="395" y="87" font-size="43" font-weight="700" fill="#f8fafc">Galaxy Tab 4</text>
    <text x="397" y="125" font-size="26" font-weight="600" fill="#93c5fd">SM-T531 · Mainline Linux</text>
    <text x="398" y="159" font-size="17" fill="#cbd5e1">MSM8226  /  Debian armhf  /  Native graphics</text>
    <rect x="397" y="184" rx="14" width="191" height="32" fill="#164e43" stroke="#2dd4bf" stroke-opacity=".45"/>
    <text x="492" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#a7f3d0">HARDWARE BRING-UP</text>
    <rect x="600" y="184" rx="14" width="114" height="32" fill="#172e4d" stroke="#60a5fa" stroke-opacity=".5"/>
    <text x="657" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#bfdbfe">ARMv7</text>
  </g>
</svg>
