schema_version: 1
updated: '2026-10-22'
device: Samsung Galaxy Tab 4 10.1 3G SM-T531 / matisse3g
baseline:
  kernel: '7.2.9-t531-dirty #19'
  kernel_base_commit: 5fce161649b4d779d1b76d9fcd52dc77779774b8
  project_commit: 1511f60
  production_patch_count: 120
  runtime: Phoc 0.46 / Phosh 0.58, native split GPU/KMS
  inspection: Initial inventory was read-only. The FM row now includes separate native/Android RF trials
    documented in docs/FM.md; no FM reception acceptance.
scope_note: Tasks cover confirmed board/SoC functions plus explicitly unconfirmed variants. This is not a signed
  BOM or proof that every shared vendor node is populated. VERIFIED is restricted to the stated physical test; WORKING
  is not full release acceptance. Dependency lists express primary porting prerequisites, not every kernel dependency.
state_legend:
  VERIFIED: Stated physical acceptance test passed; scope/build/date bounded.
  WORKING: Required useful function demonstrated; broader release acceptance remains.
  PARTIAL: Some functionality or control paths work; material missing functionality/tests.
  PROBES: Driver/device/interface exists; real function not physically accepted.
  IMPLEMENTING: Infrastructure/configuration exists; endpoint not accepted and completion may need changes.
  RESEARCHING: Function identified; native board integration not implemented/accepted.
  BLOCKED: Specific failed experiment or missing hardware fact prevents acceptance.
  REGRESSION: Observed user-visible failure remains unresolved.
  UNKNOWN: Population, capability or operation not established.
priorities:
  P0: Stabilize primary display/recovery/memory path before broad feature work.
  P1: Daily-use safety, boot, charging/thermal and power management.
  P2: Audio, normal I/O, sensors and usable feature completion.
  P3: Large remaining ports, advanced options and unconfirmed population; priority may change with owner needs.
